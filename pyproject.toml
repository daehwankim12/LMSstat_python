[build-system]
requires        = ["flit_core >=3.11,<4"]
build-backend   = "flit_core.buildapi"

[project]
name            = "lmsstat"
version         = "0.2.0"
readme          = "README.md"
authors         = [{ name = "Daehwan Kim", email = "kdh5358@snu.ac.kr" }]
dynamic         = ["description"]

dependencies = [
  "numpy >= 2.0.0",
  "pandas >= 2.0.0",
  "scipy >= 1.11.0",
  "statsmodels >= 0.14.2",
  "scikit-learn >= 1.0",
  "plotnine >= 0.12.0",
  "seaborn >= 0.13.0"
]

license         = { file = "LICENSE" }
classifiers     = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
requires-python = ">=3.10"

[project.optional-dependencies]
jupyter = ["ipykernel"]
test = ["pytest>=7.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::UserWarning",
    "ignore::FutureWarning",
]
markers = [
    "slow: marks tests as slow (plot tests)",
]

[project.urls]
Source          = "https://github.com/SNUFML/LMSstat_python"
